name: coxpanel-p1-acceptance

services:
  db:
    image: postgres:16-alpine
    user: "70:70"
    command: ["postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: p1test
      POSTGRES_USER: p1test
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - type: volume
        source: dbdata
        target: /var/lib/postgresql/data
        volume:
          nocopy: false
    read_only: true
    tmpfs:
      - /run/postgresql:uid=70,gid=70,mode=0755
      - /tmp:uid=70,gid=70,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p1test -d p1test"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      COXPANEL_DB_URL: postgres://p1test@db:5432/p1test?sslmode=disable
      COXPANEL_JWT_SECRET: ${P1_TEST_JWT_SECRET:?P1_TEST_JWT_SECRET must be set at runtime}
      COXPANEL_ADDR: :8080
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${P1_TEST_FRONTEND_PORT:-18173}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  target:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./target:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${P1_TEST_TARGET_PORT:-18180}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  agent:
    profiles: ["agent"]
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    depends_on:
      - backend
    environment:
      COXPANEL_AGENT_CREDENTIAL: ${P1_TEST_AGENT_CREDENTIAL-}
    command:
      - -panel
      - http://backend:8080
      - -node
      - ${P1_TEST_AGENT_NODE_ID-}
      - -config
      - /var/lib/coxpanel/config.json
      - -interval
      - 5s
    volumes:
      - agentstate:/var/lib/coxpanel
      - ${P1_TEST_FIXTURES_DIR:-./fixtures}:/var/lib/coxpanel/fixtures:ro
    ports:
      - "127.0.0.1:${P1_TEST_REALITY_PORT:-18443}:18443"
      - "127.0.0.1:${P1_TEST_SS2022_PORT:-18388}:18388"
      - "127.0.0.1:${P1_TEST_HYSTERIA2_PORT:-18444}:18444/udp"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

volumes:
  dbdata:
  agentstate:

networks:
  default:
    internal: true
